name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check src/ tests/
      - name: Format check
        run: uv run ruff format --check src/ tests/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          AUDIT_AGENT_TOOL_MODE: strict
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Docker-in-Docker is available on ubuntu-latest runners by default.
    # testcontainers uses the host Docker daemon via /var/run/docker.sock.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run integration tests
        run: uv run pytest tests/integration/ -v -m integration --tb=short
        env:
          AUDIT_AGENT_TOOL_MODE: mock
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # testcontainers manages Postgres internally — no external service needed
