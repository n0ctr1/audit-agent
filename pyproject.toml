[project]
name = "audit-agent"
version = "0.1.0"
description = "Autonomous AI agent for Solidity smart contract security auditing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "neo4j>=5.20.0",
    "qdrant-client>=1.9.0",
    "minio>=7.2.0",
    "docker>=7.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.0",
    "jinja2>=3.1.0",
    "psycopg2-binary>=2.9.11",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg-binary>=3.3.3",
    "openai>=2.33.0",
]

[project.scripts]
audit-agent = "audit_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_agent", "benchmarks"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires Docker (testcontainers) to run",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
voyage = ["voyageai>=0.3"]
all = ["openai>=1.30", "voyageai>=0.3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.14.2",
]
